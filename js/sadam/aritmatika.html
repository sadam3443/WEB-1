    <script>
       let x=5;

 /* Kasus adalah
    menghitung nilai mahasiswa dimana
    nilai tugas = 10 persen
    nilai absen = 20 persen
    nilai quis  = 5 persen
    nilai uts   = 20 persen
    nilai uas   = 35 persen
    total nilai
    nilai rata-rata 
    */

    let predikat, nt,na,nq,nut, nuas, tot, rat;
    nt=70;
    na=78;
    nq=89;
    nut=50;
    nuas=75;

    tot=(nt*0.1)+(na*0.2)+(nq*0.05)+(nut*0.20)+(nuas*0.35);
    rat=tot/5;

    if(tot>90){
        text ="Lulus";
        predikat="A";
    }
    else if (tot>80){
        predikat = "B";
        text ="Lulus";
    }

    else if(tot>70){
        predikat = "C";
        text ="Lulus";
    }
    else if(tot>60){
        text ="Gagal";
        predikat = "D";
    }
    else{
         text ="Gagal"
        predikat = "E";
    }
    document.getElementById("total").innerHTML = "Total Nilai " +tot;
    document.getElementById("rat").innerHTML = "Nilai Rata-rata " +rat;
    document.getElementById("text").innerHTML = "Keterangan " +text;
    document.getElementById("predikat").innerHTML = "Keterangan " +predikat;
    

 </script>
